<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dual Game Zone 🎮</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    height: 100vh;
    font-family: "Segoe UI", sans-serif;
  }

  /* Left side: Queue Game */
  .queue-section {
    width: 50%;
    background: #f8f9fa;
    border-right: 3px solid #ccc;
    text-align: center;
    padding: 20px;
  }

  .queue-area {
    position: relative;
    width: 90%;
    height: 250px;
    margin: 0 auto;
    border: 2px dashed #3b7af0;
    border-radius: 10px;
    background: #fff;
    overflow: hidden;
  }

  .person {
    position: absolute;
    bottom: 10px;
    width: 60px;
    height: 100px;
    transition: all 0.8s ease;
    z-index: 0;
  }

  .booth {
    position: absolute;
    bottom: 0;
    width: 150px;
    height: 200px;
    z-index: 1;
  }

  .controls {
    margin-top: 20px;
  }

  button {
    padding: 10px 20px;
    background: #3b7af0;
    color: #fff;
    border: none;
    border-radius: 8px;
    margin: 5px;
    cursor: pointer;
    font-weight: bold;
  }

  button:hover {
    background: #2a5fad;
  }

  /* Right side: Burger Game */
  .burger-section {
    width: 50%;
    background: linear-gradient(to bottom, #fef5e7, #f8e4b7);
    position: relative;
    overflow: hidden;
    text-align: center;
  }

  .burger-section h1 {
    margin-top: 20px;
    color: #a0522d;
  }

  #controls {
    position: absolute;
    top: 90px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 20px;
    z-index: 20;
  }

  #popBtn {
    background: #a0522d;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
  }

  #popBtn:hover { background: #8b4513; }

  #message {
    background: rgba(255,255,255,0.8);
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 18px;
  }

  #gameArea {
    position: relative;
    width: 100%;
    height: 80vh;
  }

  #stackArea {
    position: absolute;
    bottom: 150px;
    left: 50%;
    transform: translateX(-50%);
    width: 250px;
    height: 55%;
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
  }

  #stackArea img {
    width: 120px;
    margin-top: -20px;
  }

  #ingredients {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 15px;
  }

  .ingredient {
    width: 80px;
    cursor: grab;
    user-select: none;
  }

  .ingredient:active {
    transform: scale(1.1);
  }
</style>
</head>
<body>

<!-- LEFT SIDE - Queue Game -->
<div class="queue-section">
  <h1>🎟️ Queue Game</h1>
  <div class="queue-area" id="queueArea">
    <img src="booth.png" class="booth" id="booth" alt="Booth">
  </div>
  <div class="controls">
    <button onclick="enqueue()">Add Person</button>
    <button onclick="dequeue()">Serve Next</button>
  </div>
</div>

<!-- RIGHT SIDE - Burger Game -->
<div class="burger-section">
  <h1>🍔 Build Your Burger!</h1>
  <div id="controls">
    <button id="popBtn">Pop Top</button>
    <div id="message">Drag ingredients to build your burger!</div>
  </div>
  <div id="gameArea">
    <div id="stackArea"></div>
    <div id="ingredients">
      <img src="bbread.png" class="ingredient" draggable="true" data-name="Bottom Bread">
      <img src="meat.png" class="ingredient" draggable="true" data-name="Meat">
      <img src="cheeze.png" class="ingredient" draggable="true" data-name="Cheese">
      <img src="let.png" class="ingredient" draggable="true" data-name="Lettuce">
      <img src="tom.png" class="ingredient" draggable="true" data-name="Tomato">
      <img src="tbread.png" class="ingredient" draggable="true" data-name="Top Bread">
    </div>
  </div>
</div>

<!-- Scripts for both games -->
<script>
// === Queue Game ===
const queueArea = document.getElementById("queueArea");
const booth = document.getElementById("booth");

const personImages = ["beto.png","betty.png","eric.png","old.png","olga.png","paco.png","lety.png"];
let queue = [], nextPerson = 0;

function enqueue() {
  if (queue.length >= 7) return alert("Queue is full!");
  const img = document.createElement("img");
  img.src = personImages[nextPerson % personImages.length];
  img.className = "person";
  queue.push(img);
  queueArea.appendChild(img);
  nextPerson++;
  updateQueuePositions();
}

function dequeue() {
  if (queue.length === 0) return alert("Queue is empty!");
  const first = queue.shift();
  first.style.transform = "translateX(500px)";
  first.style.opacity = "0";
  setTimeout(() => first.remove(), 800);
  updateQueuePositions();
}

function updateQueuePositions() {
  const spacing = 70, boothWidth = 150;
  const totalWidth = boothWidth + queue.length * spacing;
  const startX = (queueArea.clientWidth - totalWidth) / 2;
  booth.style.left = `${startX + queue.length * spacing}px`;
  queue.forEach((p, i) => p.style.left = `${startX + (queue.length - 1 - i) * spacing}px`);
}

// === Burger Game ===
const stackArea = document.getElementById('stackArea');
const ingredients = document.querySelectorAll('.ingredient');
const message = document.getElementById('message');
const popBtn = document.getElementById('popBtn');
let stack = [];

ingredients.forEach(item => item.addEventListener('dragstart', dragStart));
stackArea.addEventListener('dragover', e => e.preventDefault());
stackArea.addEventListener('drop', dropIngredient);

function dragStart(e) {
  e.dataTransfer.setData('ingredient', e.target.src);
  e.dataTransfer.setData('name', e.target.dataset.name);
}

function dropIngredient(e) {
  e.preventDefault();
  const src = e.dataTransfer.getData('ingredient');
  const name = e.dataTransfer.getData('name');
  const img = document.createElement('img');
  img.src = src; img.draggable = false;
  stack.push({ src, name, element: img });
  stackArea.appendChild(img);
  message.textContent = `Stack size: ${stack.length}`;
}

popBtn.addEventListener('click', () => {
  if (stack.length > 0) {
    const top = stack.pop();
    stackArea.removeChild(top.element);
    message.textContent = `Popped: ${top.name}`;
  } else {
    message.textContent = "Stack is empty!";
  }
});
</script>
</body>
</html>
